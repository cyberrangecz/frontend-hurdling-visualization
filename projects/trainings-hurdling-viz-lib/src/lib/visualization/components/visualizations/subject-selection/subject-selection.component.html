<div class="vis-participant-grid" [style.width]="gridWidth + 'px'">
    <div class="viz-hurdling-subject-tooltip"></div>
    <div class="displayed-indicator">
        {{ getDisplayedSubjects().length }} of <span>{{ visualizationData.progress.length }} {{getSubjectTypeName()}}</span> displayed

        <span><button class="subject-selector" mat-button (click)="showAllSubjects()">Show all</button></span>
        <span><button class="subject-selector" mat-button (click)="hideAllSubjects()">Hide all</button></span>

    </div>
    <mat-grid-list cols="{{ numberOfColumns }}" [rowHeight]="rowHeight">
        <mat-grid-tile class="participant-tile" *ngFor="let subject of visualizationData.progress">
            <ng-container>
                <div class="participant-tile-container" (mouseover)="over(subject)"
                     (mouseout)="out()">
                    <div
                            (click)="checkIfActive(subject) ? toggleSubject(subject) : false"
                            [ngClass]="{
   					    unselected: !checkIfSelected(subject),
					    selected: checkIfSelected(subject),
					    pointer: checkIfActive(subject)
					}"
                            class="subject-container">
                        <div class="subject-avatar-container"
                             [matTooltip]="buildSubjectTooltip(subject)"
                             [ngClass]="{ 'not-active': !checkIfActive(subject) }">
                            <img class="participant-avatar" src="{{'data:image/jpg;base64,' + subject.picture}}">
                        </div>
                        <div [matTooltip]="'no training data available'"
                             *ngIf="!checkIfActive(subject)"
                             class="not-active-text overlap">
                            N/A
                        </div>
                    </div>
                    <div (click)="checkIfActive(subject) ? toggleSubject(subject) : false"
                         class="participant-name"
                         [ngClass]="{
						 'not-active': !checkIfActive(subject),
						 pointer: checkIfActive(subject),
						 'unselected-name': !checkIfSelected(subject)
						 }">
                        {{ subject.name }}
                    </div>
                    <div (click)="fadeCurrentWarnings(subject)"
                         *ngIf="checkIfActive(subject) && hasWarnings(subject)"
                         class="warning"
                         [ngClass]="{'faded': allCurrentWarningsFaded(subject) }"
                         [matTooltipClass]="'subject-selection-warning'"
                         [matTooltip]="buildWarningTooltip(subject)">
                        !
                    </div>
                </div>
            </ng-container>
        </mat-grid-tile>

    </mat-grid-list>
</div>
