<div class="overall-time-container">
    <crczp-viz-hurdling-overview-progress-bar
            [visualizationData]="visualizationData">
    </crczp-viz-hurdling-overview-progress-bar>
</div>

<div class="subject-grid-container subject-selection" [style.display]="subjectDetailId ? 'none' : 'block'">
    <crczp-viz-hurdling-subject-selection
            [isCoop]="isCoop"
            [visualizationData]="visualizationData"
            [selectedSubjectDisplay]="selectedSubjectDisplay"
            [filteredSubjects]="filteredData"
            (filteredSubjectsChange)="setFilteredSubjects($event)"
            (highlightSubjectsChange)="setHighlightedSubjects($event)">
    </crczp-viz-hurdling-subject-selection>
</div>

<div class="level-grid-container">
    <crczp-viz-hurdling-level-list
            [isCoop]="isCoop"
            [visualizationData]="visualizationData"
            (filteredSubjects)="setFilteredSubjects($event)"
            (subjectSort)="setSort($event)">
    </crczp-viz-hurdling-level-list>
</div>

<div *ngIf="subjectDetailId" class="subject-detail-container">
    <crczp-subject-detail
            [progressSubject]=getSubjectData(subjectDetailId)
            [visualizationData]="visualizationData"
            [trainingInstanceId]="trainingInstanceId"
            (hideDetail)="onSubjectDetailChange()"/>
</div>

<div class="visualization-container" [style.display]="subjectDetailId ? 'none' : 'block'">
    <div class="progress-header">
        <crczp-viz-hurdling-column-header
                class="header subject-name-header"
                (sortEmitter)="onSortValueChange('name', $event.sortReverse)"
                [sortType]="'name'"
                [selectedSortType]="sortType"
                [selectedSortReverse]="sortReverse"
                [label]="'Training run'"/>

        <span class="header ctf-progress-header-column"
              id="progress-elapsed-time"
              matTooltip="Elapsed time">
                        {{ getTimeString(visualizationData.currentTime - visualizationData.startTime) }}
        </span>

        <crczp-viz-hurdling-column-header
                class="header subject-time-header"
                matTooltip="Training times of individual subjects (hh:mm:ss)"
                (sortEmitter)="onSortValueChange('time', $event.sortReverse)"
                [sortType]="'time'"
                [selectedSortType]="sortType"
                [selectedSortReverse]="sortReverse"
                [label]="'Time'"/>
    </div>
    <div class="progress-container"
         (window:resize)="onResize()"></div>
</div>

<div class="legend-container">
    <crczp-viz-hurdling-legend
            [selectedViewValue]="view"
            (zoomResetChange)="onZoomReset()"/>
</div>
