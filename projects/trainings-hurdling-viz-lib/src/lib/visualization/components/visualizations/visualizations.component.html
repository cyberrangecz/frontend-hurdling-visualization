<ng-container *ngIf="view === getViewEnum().Progress && visualizationData$ | async ">
    <crczp-viz-hurdling-settings
            [maximumTime]="maxTime"
            [timelineStepSize]="stepSize"
            (scaleRestrictionEvent)="scaleRestrictionEvent($event)"
            (restrictBySubject)="restrictionTypeEvent($event, 'restrictToVisibleSubjects')"
            (restrictToTimeline)="restrictionTypeEvent($event, 'restrictToCustomTimelines')"
    />
    <crczp-viz-progress
            id="viz-progress"
            [isCoop]="isCoop"
            [visualizationData]="visualizationData$ | async"
            [view]="view"
            [setDashboardView]="setDashboardView"
            [externalFilters]="externalFilters"
            [trainingInstanceId]="trainingInstanceId"
            [restrictToCustomTimelines]="restrictToCustomTimelines"
            [restrictToVisibleSubjects]="restrictToVisibleSubjects"
            [restriction]="restriction"
            (getMaxTime)="getMaxTime($event)"
            (getStepSize)="getStepSize($event)"
    />
</ng-container>

<ng-container *ngIf="view === getViewEnum().Overview && visualizationData$ | async ">
    <crczp-viz-hurdling
            [visualizationData]="visualizationData$ | async"
            [view]="view"
            [colorScheme]="colorScheme"
            [setDashboardView]="setDashboardView"
            [externalFilters]="externalFilters"
            [trainingColors]="trainingColors"
            [subjectColorScheme]="subjectColorScheme"
            [trainingInstanceId]="trainingInstanceId"
            [selectedSubjects]="selectedSubjects"
            (outputSelectedSubjects)="selectSubjects($event)"
            (highlightedSubject)="emitHighlightedSubject($event)"/>
</ng-container>
