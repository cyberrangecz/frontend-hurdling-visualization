<div class="container">
    <div class="levels-row">
        <div
                *ngFor="let level of visualizationData.levels"
                [ngClass]="{ faded: isFinished(level.id)}"
                class="level"
                [matTooltip]="getLevelTooltip(level)"
                [matTooltipClass]="'line-broken-tooltip'">
            <div>
                {{ level.title }}
            </div>
            <div *ngIf="isFinished(level.id)">
                {{ visualizationData.progress.length }} / {{ visualizationData.progress.length }}
            </div>
            <div *ngIf="!isFinished(level.id)"
                 (click)="getSubjectsForLevel(level.id).length !== 0 ? filterProgressData(getSubjectsForLevel(level.id), level) : ''"
                 [ngClass]="{
				 	clickable: getSubjectsForLevel(level.id).length !== 0,
				  	faded: getSubjectsForLevel(level.id).length === 0
				 }">
                {{ getSubjectsForLevel(level.id).length }} playing
            </div>
        </div>

        <div class="level" matTooltip="Training finished">
            <div>Training finished</div>
            <div (click)="getFinishedRuns().length !== 0 ? filterProgressData(getFinishedRuns(), null) : ''"
                 [ngClass]="{
					clickable: getFinishedRuns().length !== 0,
					faded: getFinishedRuns().length === 0
				}">
                {{ getFinishedRuns().length }}
                {{ (isCoop ? "team" : "trainee") + ((getFinishedRuns().length !== 1) ?  "s" : "" )}}
            </div>
        </div>
    </div>
</div>
