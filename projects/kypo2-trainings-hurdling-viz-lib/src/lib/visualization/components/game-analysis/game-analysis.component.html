	<div class="ctf-progress-wrapper">
	<div class="container-fluid">
		<div class="row ctf-progress-head-wrapper">
			<div class="col-12">
				<div class="ctf-progress-head">
					<div class="ctf-progress-options">
						<div class="ctf-progress-select-wrapper" *ngIf="!errorMessage && enableViewMenu">
							<div class="ctf-progress-select">
								<svg class="ctf-progress-select-icon" width="20" height="20" viewBox="0 0 24 24">
									<path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" />
								</svg>
								<select [(ngModel)]="selectedViewValue" (change)="onViewValueChange()">
									<option *ngFor="let o of viewOptions" [ngValue]="o.id">{{o.name}}</option>
								</select>
							</div>
						</div>

						<div class="ctf-progress-select-wrapper" *ngIf="!errorMessage">
							<div class="ctf-progress-select">
								<svg class="ctf-progress-select-icon" width="20" height="20" viewBox="0 0 24 24">
									<path d="M14,12V19.88C14.04,20.18 13.94,20.5 13.71,20.71C13.32,21.1 12.69,21.1 12.3,20.71L10.29,18.7C10.06,18.47 9.96,18.16 10,17.87V12H9.97L4.21,4.62C3.87,4.19 3.95,3.56 4.38,3.22C4.57,3.08 4.78,3 5,3V3H19V3C19.22,3 19.43,3.08 19.62,3.22C20.05,3.56 20.13,4.19 19.79,4.62L14.03,12H14Z" />
								</svg>
								<select [(ngModel)]="selectedFilterValue" (change)="onFilterValueChange()">
									<option *ngFor="let o of filterOptions" [ngValue]="o.id">{{o.name}}</option>
								</select>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="ctfh-row align-items-end ctfh-no-gutters">
			<div class="ctfh-col-2" *ngIf="hasData">
				<div class="ctf-progress-column ctf-progress-teamcolumn">
					<app-column-header (onSort)="onSortValueChange('name', $event.sortReverse)" [sortType]="'name'" [selectedSortType]="sortType"
					 [selectedSortReverse]="sortReverse" [label]="'Player'"></app-column-header>
				</div>
			</div>

			<div class="ctfh-col-8" *ngIf="hasData">
				<div class="ctf-progress-header-levels">
					<app-column-header *ngFor="let level of levelSortOptions" (onSort)="onSortValueChange('level', $event.sortReverse, level.index)"
					 [sortType]="'level'+level.index" [selectedSortType]="sortType+sortLevel" [selectedSortReverse]="sortReverse"
					 [label]="level.name" [level]="level"></app-column-header>

					<span *ngIf="time && selectedViewValue == 1" class="ctf-progress-header-column" id="ctf-progress-time">
						{{ getTimeString(time) }}
					</span>
				</div>
			</div>

			<div class="ctfh-col-2" *ngIf="hasData">
				<div class="ctf-progress-column ctf-progress-timecolumn">
					<app-column-header (onSort)="onSortValueChange('time', $event.sortReverse)" [sortType]="'time'" [selectedSortType]="sortType"
					 [selectedSortReverse]="sortReverse" [label]="'Time'"></app-column-header>
				</div>
			</div>
		</div>

		<div class="empty-data" *ngIf="!hasData">No {{ filterStatus }} games available.</div>

		<div class="ctfh-row ctfh-no-gutters">
			<div class="ctfh-col-2">
				<div class="ctf-progress-column ctf-progress-teamcolumn ctf-progress-column-data" id="ctf-progress-teamcolumn"></div>
			</div>

			<div class="ctfh-col-8" id="hurdling-space">
				<div class="ctf-progress-chart-wrapper">
					<div id="ctf-progress-chart" class="ctf-progress" mouseWheel (mouseWheelUp)="onMouseWheelUp($event)"
					 (mouseWheelDown)="onMouseWheelDown($event)" mouseMove (mouseDrag)="onMouseDrag($event)" (mouseUp)="onMouseUp()"
					 (window:resize)="onResize()"></div>
				</div>
			</div>

			<div class="ctfh-col-2">
				<div class="ctf-progress-column ctf-progress-timecolumn ctf-progress-column-data" id="ctf-progress-timecolumn"></div>
			</div>
		</div>
	</div>
	<div class="ctfh-container-fluid" *ngIf="errorMessage">
		<div class="ctfh-row ctfh-no-gutters">
			<div class="ctfh-col-sm-8 ctfh-offset-sm-2">
				<p class="ctf-progress-error">
					<svg class="ctf-progress-error-icon" width="20" height="20" viewBox="0 0 24 24">
						<path d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" />
					</svg>
					{{errorMessage}}
				</p>
			</div>
		</div>
	</div>
	<div class="ctfh-container-fluid" *ngIf="hasData && legendIcons">
		<div class="ctfh-row ctfh-no-gutters">
			<div class="ctfh-col-8 ctfh-offset-2">
				<div class="ctf-progress-legend">
					<div class="ctf-progress-legend-left">
						<div class="ctf-progress-legend-left-top">
							<span class="ctf-progress-legend-item ctf-progress-legend-limit">
								<svg class="ctf-progress-legend-icon" height="18" width="2" viewBox="0 0 2 18">
									<rect y="0" x="0" height="18" width="2"></rect>
								</svg>
								Level time limit
							</span>
							<span class="ctf-progress-legend-item ctf-progress-legend-estimate" *ngIf="true">
								<svg class="ctf-progress-legend-icon" height="18" width="35" viewBox="0 0 35 18" fill="#8c8b8b">
									<defs>
										<pattern id="diagonalHatchGray" patternUnits="userSpaceOnUse" width="7" height="4" patternTransform="rotate(45)">
											<rect width="3" height="4" transform="translate(0,0)" opacity="0.5"></rect>
										</pattern>
									</defs>
									<rect y="0" x="0" height="18" width="35" fill="url('#diagonalHatchGray')"></rect>
								</svg>
								Estimated time
							</span>
							<span class="ctf-progress-legend-item ctf-progress-legend-finished" *ngIf="true">
								<svg class="ctf-progress-legend-icon" height="18" width="35" viewBox="0 0 35 18">
									<rect y="0" x="0" height="18" width="35" fill="#cccccc"></rect>
								</svg>
								Finished level
							</span>
							<span class="ctf-progress-legend-item ctf-progress-legend-active" *ngIf="true">
								<svg class="ctf-progress-legend-icon" height="18" width="35" viewBox="0 0 35 18">
									<rect y="0" x="0" height="18" width="35" fill="#848282"></rect>
								</svg>
								Active level
							</span>
							<span class="ctf-progress-legend-item" *ngFor="let icon of legendIcons">
								<svg class="ctf-progress-legend-icon" width="16px" height="16px" viewBox="0 0 16 16">
									<path attr.d="{{icon.path}}" />
								</svg>
								{{icon.label}}
							</span>
						</div>
					</div>
					<div class="ctf-progress-legend-right">
						<span class="ctf-progress-legend-item ctf-progress-legend-zoom">
							<svg class="ctf-progress-legend-icon" width="20" height="20" viewBox="0 0 24 24">
								<path d="M9,2A7,7 0 0,1 16,9C16,10.57 15.5,12 14.61,13.19L15.41,14H16L22,20L20,22L14,16V15.41L13.19,14.61C12,15.5 10.57,16 9,16A7,7 0 0,1 2,9A7,7 0 0,1 9,2M8,5V8H5V10H8V13H10V10H13V8H10V5H8Z" />
							</svg>
							Ctrl + Scroll
						</span>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
