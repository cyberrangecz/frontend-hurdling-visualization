<div class="vis-participant-grid" [style.width]="gridWidth + '%'">
	<div class="kypo2-viz-hurdling-player-tooltip"></div>
	<div class="displayed-indicator">
		{{ getDisplayedPlayers().length }} of
		<span>{{ visualizationData.players.length }} trainees</span>
		displayed

			<span>
				<button class="trainee-selector" mat-button (click)="showAllPlayers()">Show all</button>
			</span>
			<span>
				<button class="trainee-selector" mat-button (click)="hideAllPlayers()">Hide all</button>
			</span>

	</div>
	<mat-grid-list cols="{{ numberOfColumns }}" rowHeight="1:1.6" gutterSize="2%" (mouseout)="hideTooltip()">
		<mat-grid-tile class="participant-tile" *ngFor="let player of visualizationData.players">
			<ng-container>
				<div class="participant-tile-container" (mouseover)="over(player)"
				(mouseout)="out()">
					<div
					(click)="checkIfActive(player) ? togglePlayer(player) : false"
					[ngClass]="{
					unselected: !checkIfSelected(player),
					selected: checkIfSelected(player),
					pointer: checkIfActive(player)
					}"
					class="player-container">
						<div class="player-avatar-container" 
							(mousemove)="buildAndShowPlayerTooltip(player, $event)"
							(mouseout)="hideTooltip()"
							[ngClass]="{ 'not-active': !checkIfActive(player) }">
							<div *ngIf="checkIfActive(player) && (selectedPlayerView === PlayerView.Avatar || selectedPlayerView === PlayerView.Both)">
								<img class="participant-avatar" src="{{'data:image/jpg;base64,' + player.picture}}">
							</div>
								<p *ngIf="selectedPlayerView === PlayerView.Name && checkIfActive(player)">{{player.name}}</p>
						</div>
						<div (mousemove)="showTooltip(player.name, $event)"
							(mouseout)="hideTooltip()"
							*ngIf="!checkIfActive(player)"
							class="not-active-text overlap">
							N/A
						</div>
					</div>
					<div *ngIf="selectedPlayerView === PlayerView.Both" (click)="checkIfActive(player) ? togglePlayer(player) : false" class="participant-name" [ngClass]="{ 'not-active': !checkIfActive(player), pointer: checkIfActive(player), 'unselected-name': !checkIfSelected(player)}">{{player.name}}</div>
					<div (click)="fadeCurrentWarnings(player)" *ngIf="checkIfActive(player) && hasWarnings(player)" class="warning"
						[ngClass]="{'faded': allCurrentWarningsFaded(player) }"
						(mouseover)="buildAndShowWarningTooltip(player, $event)"
						(mouseout)="hideTooltip()">
						!
					</div>
				</div>
			</ng-container>
		</mat-grid-tile>
		
	</mat-grid-list>
</div>
